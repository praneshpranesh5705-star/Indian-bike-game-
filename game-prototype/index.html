<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Indian Bike AI — Prototype</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#10131a;font-family:system-ui,sans-serif;color:white}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px}.pill{background:#111a;color:#fff;border:1px solid #ffffff33;border-radius:14px;padding:9px 12px;backdrop-filter:blur(8px)}.controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px}.cluster{display:flex;gap:10px}.btn{pointer-events:auto;width:58px;height:58px;border:0;border-radius:50%;background:#ffffff22;color:white;font-size:24px;box-shadow:0 8px 25px #0008}.phone{display:none;pointer-events:auto;position:absolute;right:18px;bottom:90px;width:290px;height:500px;border:8px solid #171717;border-radius:35px;background:linear-gradient(160deg,#101827,#182b48);box-shadow:0 20px 60px #000b;padding:18px}.phone h2{margin:20px 8px 4px}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.app{border:0;border-radius:20px;background:#ffffff16;color:#fff;padding:14px 4px;font-size:12px}.app b{display:block;font-size:30px;margin-bottom:6px}.chat{display:none;position:absolute;inset:18px;background:#10141c;border-radius:25px;padding:14px}.messages{height:355px;overflow:auto;font-size:13px}.msg{padding:10px 12px;margin:8px 0;border-radius:14px;background:#ffffff12}.user{background:#294e72}.input{display:flex;gap:7px}.input input{min-width:0;flex:1;border-radius:12px;border:1px solid #ffffff22;background:#fff1;color:white;padding:10px}.input button{border:0;border-radius:12px;background:#3aa7ff;color:white;padding:10px}.back{border:0;background:#ffffff15;color:#fff;border-radius:10px;padding:7px 10px}.mission{position:absolute;left:50%;top:55px;transform:translateX(-50%);max-width:330px;text-align:center;background:#0d1724dd;border:1px solid #ffffff22;border-radius:16px;padding:10px;display:none}
</style></head>
<body><canvas id="c"></canvas><div class="hud"><div class="top"><div class="pill">🏍️ AI Bike City</div><div class="pill" id="speed">0 km/h</div></div><div class="mission" id="mission"></div><div class="controls"><div class="cluster"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><div class="cluster"><button class="btn" id="phoneBtn">📱</button><button class="btn" id="gas">▲</button></div></div><div class="phone" id="phone"><button class="back" id="closePhone">Back</button><h2>My Phone</h2><div class="apps"><button class="app"><b>🌐</b>Internet</button><button class="app"><b>🗺️</b>Map</button><button class="app"><b>🎵</b>Music</button><button class="app"><b>📷</b>Camera</button><button class="app"><b>🏍️</b>Garage</button><button class="app" id="aiApp"><b>🤖</b>Bike AI</button></div><div class="chat" id="chat"><button class="back" id="backApps">← Apps</button><h3>🤖 Bike AI</h3><div class="messages" id="messages"><div class="msg">Hi! I am your Bike AI. Ask me for a bike recommendation or a driving challenge.</div></div><div class="input"><input id="q" placeholder="Ask Bike AI..."><button id="send">Send</button></div></div></div></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,bikeX=.5,z=0,speed=0,keys={};function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
function draw(){x.fillStyle='#79aee8';x.fillRect(0,0,W,H*.48);x.fillStyle='#6d9b52';x.fillRect(0,H*.48,W,H*.52);let horizon=H*.48;for(let i=0;i<18;i++){let p=i/18,yy=horizon+(p*p)*(H-horizon),rw=80+p*p*W*1.5; x.fillStyle='#4b4b4b';x.beginPath();x.moveTo(W/2-rw/2,yy);x.lineTo(W/2+rw/2,yy);x.lineTo(W/2+rw/2*.98,yy+18);x.lineTo(W/2-rw/2*.98,yy+18);x.fill()}x.fillStyle='#f5f5f5';for(let i=0;i<10;i++){let p=((i/10+z)%1),yy=horizon+p*p*(H-horizon),w=4+p*10;x.fillRect(W/2-w/2,yy,w,18)}x.save();x.translate(W*bikeX,H*.78);x.fillStyle='#161b22';x.beginPath();x.arc(-25,28,15,0,7);x.arc(25,28,15,0,7);x.fill();x.fillStyle='#e33';x.fillRect(-18,-5,36,30);x.fillStyle='#222';x.fillRect(-8,-25,16,25);x.restore();document.getElementById('speed').textContent=Math.round(speed*120)+' km/h';requestAnimationFrame(draw)}draw();
setInterval(()=>{if(speed>0){z=(z+speed*.02)%1}},30);function bind(id,key){let e=document.getElementById(id);e.onpointerdown=()=>keys[key]=true;e.onpointerup=e.onpointercancel=()=>keys[key]=false}bind('gas','up');bind('left','left');bind('right','right');setInterval(()=>{if(keys.up)speed=Math.min(1,speed+.03);else speed=Math.max(0,speed-.015);if(keys.left)bikeX=Math.max(.25,bikeX-.012);if(keys.right)bikeX=Math.min(.75,bikeX+.012)},30);
const phone=document.getElementById('phone'),chat=document.getElementById('chat'),apps=document.querySelector('.apps'),messages=document.getElementById('messages');document.getElementById('phoneBtn').onclick=()=>phone.style.display='block';document.getElementById('closePhone').onclick=()=>phone.style.display='none';document.getElementById('aiApp').onclick=()=>{apps.style.display='none';chat.style.display='block'};document.getElementById('backApps').onclick=()=>{chat.style.display='none';apps.style.display='grid'};
async function ask(){let q=document.getElementById('q').value.trim();if(!q)return;messages.innerHTML+=`<div class="msg user">${q.replace(/[<>]/g,'')}</div>`;document.getElementById('q').value='';let a='Try the Sport bike for balanced acceleration and control. Want me to create a challenge?';if(/challenge|mission/i.test(q))a='Challenge: reach the hill checkpoint in 3 minutes without crashing. Bonus: finish with more than 50% fuel.';messages.innerHTML+=`<div class="msg">${a}</div>`;messages.scrollTop=messages.scrollHeight}document.getElementById('send').onclick=ask;document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')ask()};
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Indian Bike AI — City Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#10131a;font-family:system-ui,sans-serif;color:#fff}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}.pill{background:#111a;color:#fff;border:1px solid #ffffff2b;border-radius:14px;padding:8px 11px;backdrop-filter:blur(8px);font-size:13px}.controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px}.cluster{display:flex;gap:9px}.btn{pointer-events:auto;width:58px;height:58px;border:1px solid #ffffff22;border-radius:50%;background:#111c;color:#fff;font-size:23px;box-shadow:0 8px 25px #0009}.phone{display:none;pointer-events:auto;position:absolute;right:15px;bottom:86px;width:min(310px,calc(100vw - 30px));height:min(530px,calc(100vh - 110px));border:7px solid #171717;border-radius:34px;background:linear-gradient(160deg,#101827,#182b48);box-shadow:0 20px 60px #000b;padding:15px}.phone h2{margin:17px 7px 2px}.sub{margin:0 7px;color:#a9bad0;font-size:12px}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.app{border:1px solid #ffffff12;border-radius:19px;background:#ffffff14;color:#fff;padding:13px 3px;font-size:11px}.app b{display:block;font-size:27px;margin-bottom:5px}.chat{display:none;position:absolute;inset:15px;background:#10141c;border-radius:23px;padding:13px}.messages{height:calc(100% - 105px);overflow:auto;font-size:13px}.msg{padding:9px 11px;margin:7px 0;border-radius:13px;background:#ffffff12;line-height:1.35}.user{background:#294e72}.input{display:flex;gap:7px}.input input{min-width:0;flex:1;border-radius:11px;border:1px solid #ffffff22;background:#fff1;color:white;padding:10px}.input button{border:0;border-radius:11px;background:#3aa7ff;color:white;padding:10px}.back{border:0;background:#ffffff15;color:#fff;border-radius:10px;padding:7px 10px}.mission{position:absolute;left:50%;top:53px;transform:translateX(-50%);width:min(350px,90vw);text-align:center;background:#0d1724e8;border:1px solid #ffffff22;border-radius:16px;padding:10px;display:none;font-size:12px}.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);background:#101820dd;border:1px solid #ffffff22;padding:9px 13px;border-radius:14px;display:none;font-size:12px}
</style></head>
<body><canvas id="c"></canvas><div class="hud"><div class="top"><div class="pill">🏍️ Indian Bike AI</div><div class="pill" id="stats">0 km/h · ⛽ 100%</div></div><div class="mission" id="mission"></div><div class="toast" id="toast"></div><div class="controls"><div class="cluster"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><div class="cluster"><button class="btn" id="phoneBtn">📱</button><button class="btn" id="gas">▲</button></div></div><div class="phone" id="phone"><button class="back" id="closePhone">Back</button><h2>My Phone</h2><p class="sub">Connected • Indian Bike City</p><div class="apps"><button class="app"><b>🌐</b>Internet</button><button class="app"><b>🗺️</b>Map</button><button class="app"><b>🎵</b>Music</button><button class="app"><b>📷</b>Camera</button><button class="app"><b>🏍️</b>Garage</button><button class="app" id="aiApp"><b>🤖</b>Bike AI</button></div><div class="chat" id="chat"><button class="back" id="backApps">← Apps</button><h3>🤖 Bike AI</h3><div class="messages" id="messages"><div class="msg">Hi! I am Bike AI. Ask for a bike recommendation, a route idea, or a driving challenge.</div></div><div class="input"><input id="q" placeholder="Ask Bike AI..."><button id="send">Send</button></div></div></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,bikeX=.5,z=0,speed=0,fuel=100,keys={},traffic=[{lane:.36,d:.2,spd:.35},{lane:.64,d:.58,spd:.22},{lane:.5,d:.82,spd:.18}],missionDone=false;
function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function roadY(p){return H*.47+p*p*(H*.56)}function roadW(p){return 70+p*p*W*1.55}
function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H*.5);g.addColorStop(0,'#70a9df');g.addColorStop(1,'#d8c18f');x.fillStyle=g;x.fillRect(0,0,W,H*.5);x.fillStyle='#6b9853';x.fillRect(0,H*.5,W,H*.5);
// buildings and trees
for(let i=0;i<12;i++){let side=i%2?-1:1, bx=W/2+side*(W*.25+(i%3)*W*.12), bh=45+(i%4)*22; x.fillStyle=i%3?'#c9a67d':'#9b6f54';x.fillRect(bx,H*.47-bh,55,bh);x.fillStyle='#fff8';for(let r=0;r<3;r++)x.fillRect(bx+9+(r%2)*22,H*.47-bh+12+r*16,9,7)}
let horizon=H*.47;for(let i=0;i<22;i++){let p=i/22,yy=roadY(p),rw=roadW(p);x.fillStyle='#4a4b4d';x.beginPath();x.moveTo(W/2-rw/2,yy);x.lineTo(W/2+rw/2,yy);x.lineTo(W/2+rw/2*.985,yy+22);x.lineTo(W/2-rw/2*.985,yy+22);x.fill()}
x.fillStyle='#f6f2d5';for(let i=0;i<12;i++){let p=((i/12+z)%1),yy=roadY(p),w=3+p*12;x.fillRect(W/2-w/2,yy,w,18+p*10)}
traffic.forEach(t=>{t.d=(t.d+(speed*.012-t.spd*.004)+1)%1;let yy=roadY(t.d),rw=roadW(t.d),cx=W/2-rw/2+t.lane*rw,s=10+t.d*30;x.fillStyle='#222';x.fillRect(cx-s*.6,yy-s*.35,s*1.2,s*.7);x.fillStyle='#ddd';x.fillRect(cx-s*.3,yy-s*.7,s*.6,s*.35)});
x.save();x.translate(W*bikeX,H*.78);x.fillStyle='#111';x.beginPath();x.arc(-24,28,15,0,7);x.arc(24,28,15,0,7);x.fill();x.fillStyle='#d92e2e';x.beginPath();x.moveTo(-19,22);x.lineTo(-10,-10);x.lineTo(13,-10);x.lineTo(20,22);x.fill();x.fillStyle='#20242b';x.fillRect(-7,-29,14,23);x.fillStyle='#f5c84b';x.fillRect(-13,4,26,5);x.restore();
requestAnimationFrame(draw)}draw();
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',1800)}
function bind(id,key){let e=document.getElementById(id);e.onpointerdown=()=>keys[key]=true;e.onpointerup=e.onpointercancel=()=>keys[key]=false}bind('gas','up');bind('left','left');bind('right','right');
setInterval(()=>{if(keys.up){speed=Math.min(1,speed+.025);fuel=Math.max(0,fuel-.045)}else speed=Math.max(0,speed-.018);if(keys.left)bikeX=Math.max(.24,bikeX-.012);if(keys.right)bikeX=Math.min(.76,bikeX+.012);z=(z+speed*.018)%1;document.getElementById('stats').textContent=Math.round(speed*125)+' km/h · ⛽ '+Math.round(fuel)+'%';if(fuel<15)toast('Low fuel — visit a fuel station in the next version')},30);
const phone=document.getElementById('phone'),chat=document.getElementById('chat'),apps=document.querySelector('.apps'),messages=document.getElementById('messages');document.getElementById('phoneBtn').onclick=()=>phone.style.display='block';document.getElementById('closePhone').onclick=()=>phone.style.display='none';document.getElementById('aiApp').onclick=()=>{apps.style.display='none';chat.style.display='block'};document.getElementById('backApps').onclick=()=>{chat.style.display='none';apps.style.display='grid'};
async function ask(){let q=document.getElementById('q').value.trim();if(!q)return;messages.innerHTML+=`<div class="msg user">${q.replace(/[<>]/g,'')}</div>`;document.getElementById('q').value='';let a;if(/challenge|mission|task/i.test(q)){a='🏁 Challenge: reach the hill checkpoint in 3 minutes without crashing. Bonus: finish above 50% fuel.';document.getElementById('mission').textContent=a;document.getElementById('mission').style.display='block';setTimeout(()=>document.getElementById('mission').style.display='none',7000)}else if(/which bike|bike should|recommend/i.test(q))a='🏍️ Recommendation: choose the Sport bike for balanced acceleration and control. Choose Cruiser for stability or Dirt bike for rough roads.';else if(/route|road|city/i.test(q))a='🗺️ Route idea: take the main road, avoid traffic, then turn toward the hill checkpoint. A map and traffic system will be added next.';else a='🤖 I can help with bike choice, driving challenges, routes, fuel strategy and game missions. Try: “Give me a challenge.”';messages.innerHTML+=`<div class="msg">${a}</div>`;messages.scrollTop=messages.scrollHeight}document.getElementById('send').onclick=ask;document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')ask()};
</script></body></html>
